# Layer 3/4 guardrail under the mesh: only the API port comes in, nothing goes out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-api
  namespace: demo-api
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        # Istio ambient: traffic from other mesh pods arrives through the HBONE tunnel port.
        - port: 15008
          protocol: TCP
