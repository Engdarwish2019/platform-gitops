apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-policies
policies:
  - ../require-labels.yaml
  - ../pod-security-restricted.yaml
  - ../require-requests-limits.yaml
  - ../disallow-latest-tag.yaml
  - ../restrict-image-registries.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: require-labels
    rule: require-name-and-part-of
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: require-labels
    rule: require-name-and-part-of
    resources: [unlabeled-pod]
    kind: Pod
    result: fail
  - policy: pod-security-restricted
    rule: restricted
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: pod-security-restricted
    rule: restricted
    resources: [privileged-pod]
    kind: Pod
    result: fail
  - policy: require-requests-limits
    rule: containers-have-resources
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: require-requests-limits
    rule: containers-have-resources
    resources: [no-limits-pod]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: disallow-latest
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: disallow-latest
    resources: [latest-pod]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    rule: approved-registries
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    rule: approved-registries
    resources: [untrusted-registry-pod]
    kind: Pod
    result: fail
