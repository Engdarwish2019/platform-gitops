apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory requests and a memory limit
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: containers-have-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  platform.io/tenant: "true"
      validate:
        message: "CPU and memory requests and a memory limit are required for every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
