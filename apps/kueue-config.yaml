apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kueue-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Engdarwish2019/platform-gitops.git
    targetRevision: main
    path: platform/kueue
    directory:
      exclude: "{tests/*,*-values.yaml,values.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
