# Grafana's admin login comes from Vault (secret/platform/grafana), never from Git.
#   vault kv put secret/platform/grafana admin-user=admin admin-password="$(openssl rand -base64 24)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana
        property: admin-password
