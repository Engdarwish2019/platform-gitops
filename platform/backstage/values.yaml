# Helm values for the backstage chart.
# Uses the upstream demo image; real installs run their own Backstage build pinned by digest.
backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
  appConfig:
    app:
      baseUrl: http://localhost:7007
    backend:
      baseUrl: http://localhost:7007
    catalog:
      locations:
        - type: url
          target: https://github.com/Engdarwish2019/platform-gitops/blob/main/backstage/catalog-info.yaml
        - type: url
          target: https://github.com/Engdarwish2019/platform-gitops/blob/main/backstage/templates/new-service/template.yaml
          rules:
            - allow: [Template]
postgresql:
  enabled: true
