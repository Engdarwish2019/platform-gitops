# GPU nodes as a Kueue flavor: the same node label and taint the vLLM workload uses.
# Kueue adds the node selector and toleration to every pod it admits on this flavor.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu
spec:
  nodeLabels:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
# Cluster-wide GPU quota for tenant namespaces. Jobs wait in the queue instead of sitting
# Pending on the scheduler; higher-priority work can preempt lower-priority work.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu
spec:
  namespaceSelector:
    matchLabels:
      platform.io/tenant: "true"
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: [cpu, memory, nvidia.com/gpu]
      flavors:
        - name: gpu
          resources:
            - name: cpu
              nominalQuota: 16
            - name: memory
              nominalQuota: 64Gi
            - name: nvidia.com/gpu
              nominalQuota: 2
