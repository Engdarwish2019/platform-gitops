# One store for the whole cluster, backed by the Vault set up by
# github.com/Engdarwish2019/devsecops-pipeline (vault/setup.sh creates the
# "external-secrets" Kubernetes auth role and its read-only policy on secret/platform/*).
# Before the first sync, put Vault's CA certificate in the vault-ca ConfigMap:
#   kubectl -n external-secrets create configmap vault-ca --from-file=ca.crt=vault-ca.pem
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
